<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cenová nabídka – Prima Shade</title>
<style>
@font-face{font-family:Poppins;src:url(/offer/Poppins-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Poppins;src:url(/offer/Poppins-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
:root{--ink:#1f2b33;--muted:#66737d;--line:#ece4d8;--gold:#f0a23b;--gold-ink:#2b1a04;--gold-dark:#a8691a;--bg:#faf7f2;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Poppins,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:68px}
header.top img{height:36px;width:auto;display:block}
header.top .code{font-size:13px;color:var(--muted)}
.hero{position:relative;min-height:420px;display:flex;align-items:flex-end;color:#fff;background:#2a2f33 center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(10,14,18,.78) 100%)}
.hero .wrap{position:relative;width:100%;padding-bottom:36px}
.hero .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#ffd49a}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:6px 0 10px;font-weight:700}
.hero .for{font-size:16px;opacity:.92}
.banner{background:#fff4e2;border-bottom:1px solid var(--line);font-size:14px;padding:10px 0;color:var(--gold-ink)}
section{padding:44px 0 8px}
h2{font-size:24px;margin:0 0 18px;font-weight:700}
h2 small{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dark);font-weight:400;margin-bottom:2px}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.param{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.param span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.param b{font-size:17px}
.items{display:grid;gap:12px}
.item{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.item img{width:110px;height:70px;object-fit:cover;border-radius:8px;flex:none;background:#f1ece4}
.item b{display:block;font-size:16px}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.price{background:var(--ink);color:#fff;border-radius:16px;padding:26px 28px;display:grid;gap:8px}
.price .row{display:flex;justify-content:space-between;gap:16px;font-size:15px;opacity:.9}
.price .final{border-top:1px solid rgba(255,255,255,.18);margin-top:6px;padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.price .final span{font-size:15px;opacity:.9}
.price .final b{font-size:clamp(28px,5vw,38px);color:var(--gold)}
.price .note{font-size:13px;opacity:.7}
.valid{font-size:14px;color:var(--muted);margin-top:10px}
.valid.bad{color:#b23b2b;font-weight:700}
.text{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;white-space:pre-wrap;font-size:15px}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.why div{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.why img{width:100%;height:180px;object-fit:cover;display:block}
.why b{display:block;padding:14px 16px 0;font-size:16px}
.why p{margin:4px 0 0;padding:0 16px 16px;color:var(--muted);font-size:14px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:8px;font-weight:700;text-decoration:none;font-size:16px;border:2px solid var(--gold);cursor:pointer;background:none;color:var(--ink);font-family:inherit}
.btn.main{background:var(--gold);color:var(--gold-ink)}
.btn:hover{filter:brightness(.96)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.contact{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:14px}
footer{padding:40px 0;color:var(--muted);font-size:13px;text-align:center}
.empty{padding:120px 20px;text-align:center;color:var(--muted)}
@media (max-width:600px){.hero{min-height:340px}.item img{width:84px;height:56px}.price{padding:20px}section{padding-top:34px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><img src="/logo-email.png" alt="Prima Shade"><span class="code" id="code"></span></div></header>
<main id="app"><div class="empty">Načítám nabídku…</div></main>
<footer>Prima Shade · bioklimatické pergoly na míru · <a href="https://www.primashade.cz" target="_blank" rel="noopener">www.primashade.cz</a></footer>
<script>
(() => {
  "use strict";
  const token = location.pathname.split("/").filter(Boolean).pop() || "";
  const api = "/api/stinko/o/" + encodeURIComponent(token);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const app = document.getElementById("app");
  const WHY = [["web-1.jpg","Ochrana před sluncem i deštěm","Uzavřené lamely vytvoří vodotěsnou střechu a integrovaný systém odvodnění odvádí dešťovou vodu skrytě konstrukcí."],
    ["web-2.jpg","Večery, které si chcete prodloužit","Integrované LED osvětlení vytvoří příjemnou atmosféru pro večeři, sklenku vína i posezení s přáteli."],
    ["web-3.jpg","Příjemný stín i v horkých dnech","Nastavitelné lamely vám umožní regulovat sluneční světlo i proudění vzduchu. Užijte si pohodlí na terase podle svých představ."]];

  // ---------- visit tracking: one visit per page load, time counted while the page is visible ----------
  let view = "", secs = 0, staff = false, pdf = false, dirty = false;
  const seen = new Set(), times = {};
  // the part of the offer on screen now: the section taking most of the window
  const onScreen = () => { let best = "", most = 0; document.querySelectorAll("[data-sec]").forEach(el => { const r = el.getBoundingClientRect(), vis = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0); if (vis > most){ most = vis; best = el.dataset.sec; } }); return best; };
  const vid = (() => { try { let v = localStorage.getItem("ps-vid"); if (!v){ v = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem("ps-vid", v); } return v; } catch { return ""; } })();
  const device = /iPad|Tablet/i.test(navigator.userAgent) ? "tablet" : /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "mobil" : "počítač";
  const hit = (body, keep) => fetch(api + "/hit", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), keepalive:!!keep, credentials:"same-origin"}).then(r => r.json()).catch(() => ({}));
  const report = keep => { if (!view || staff) return; dirty = false; hit({view, secs, pdf, seen:[...seen].join(","), times}, keep); };
  async function startVisit(){
    const r = await hit({vid, device}); if (r.staff){ staff = true; return; } view = r.view || "";
    setInterval(() => { if (document.visibilityState === "visible"){ secs += 5; const k = onScreen(); if (k) times[k] = (times[k]||0) + 5; dirty = true; } }, 5000);
    setInterval(() => { if (dirty) report(); }, 15000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") report(true); });
    addEventListener("pagehide", () => report(true));
  }

  function render(d, hasPdf){
    document.title = `Cenová nabídka ${d.code || ""} – Prima Shade`;
    document.getElementById("code").textContent = d.code ? "Nabídka č. " + d.code : "";
    const expired = d.validToISO && d.validToISO < new Date().toISOString().slice(0, 10);
    const sec = (key, kick, title, inner) => `<section data-sec="${key}"><div class="wrap"><h2><small>${esc(kick)}</small>${esc(title)}</h2>${inner}</div></section>`;
    const items = (list) => `<div class="items">${list.map(it => `<div class="item"><img src="/offer/${esc(it.thumb || "pergola")}.png" alt="" loading="lazy"><div><b>${esc(it.title)}</b>${it.desc ? `<p>${esc(it.desc)}</p>` : ""}</div></div>`).join("")}</div>`;
    const c = d.contact || {};
    let h = `<div class="hero" data-sec="hero" style="background-image:url(/offer/mail-hero.jpg)"><div class="wrap"><div class="kick">Cenová nabídka ${esc(d.code)}</div><h1>${esc(d.title || "Bioklimatická pergola")}</h1>${d.client ? `<div class="for">Připraveno pro: <b>${esc(d.client)}</b></div>` : ""}</div></div>`;
    if (staff) h = `<div class="banner"><div class="wrap">Náhled pro Prima Shade – vaše návštěva se do statistiky nezapočítává.</div></div>` + h;
    if (d.intro) h += sec("uvod", "Úvodem", "Dobrý den,", `<div class="text">${esc(d.intro)}</div>`);
    if ((d.params || []).length) h += sec("konfigurace", "Vaše pergola", "Parametry na míru", `<div class="params">${d.params.map(([k, v]) => `<div class="param"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>`);
    for (const s of d.sections || []) if ((s.items || []).length) h += sec(s.title === "Služby" ? "sluzby" : /Doplňky/.test(s.title) ? "doplnky" : "polozky", s.title === "Služby" ? "V ceně" : "Co dostanete", s.title, items(s.items));
    h += sec("cena", "Cena", "Vaše cena", `<div class="price">${(d.lines || []).map(l => `<div class="row"><span>${esc(l.label)}</span><span>${esc(l.value)}</span></div>`).join("")}<div class="final"><span>${esc(d.final?.label || "Vaše cena")}</span><b>${esc(d.final?.value || "")}</b></div>${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}</div>
      <div class="valid ${expired ? "bad" : ""}">${expired ? `Platnost nabídky vypršela ${esc(d.validTo)}. Ozvěte se nám, rádi ji obnovíme.` : d.validTo ? `Nabídka platí do ${esc(d.validTo)}.` : ""}</div>
      ${d.terms ? `<div class="text" style="margin-top:14px">${esc(d.terms)}</div>` : ""}`);
    h += sec("proc", "Proč Prima Shade", "Proč si zamilujete naši pergolu", `<div class="why">${WHY.map(([img, t, p]) => `<div><img src="/offer/${img}" alt="" loading="lazy"><b>${t}</b><p>${p}</p></div>`).join("")}</div>`);
    const mail = c.email ? `mailto:${encodeURIComponent(c.email).replace(/%40/g, "@")}?subject=${encodeURIComponent("Nabídka " + (d.code || ""))}` : "";
    h += sec("kontakt", "Máte otázky?", "Rádi vše probereme", `<div class="contact"><div>${c.name ? `<b>${esc(c.name)}</b><br>` : ""}${c.phone ? `<a href="tel:${esc(c.phone.replace(/\s+/g, ""))}">${esc(c.phone)}</a><br>` : ""}${c.email ? `<a href="${esc(mail)}">${esc(c.email)}</a>` : ""}</div>
      <div class="cta">${hasPdf ? `<a class="btn main" id="pdf" href="${api}/pdf" target="_blank" rel="noopener">⬇ Stáhnout nabídku v PDF</a>` : ""}${mail ? `<a class="btn" href="${esc(mail)}">✉ Odpovědět e-mailem</a>` : ""}${c.phone ? `<a class="btn" href="tel:${esc(c.phone.replace(/\s+/g, ""))}">☎ Zavolat</a>` : ""}</div></div>`);
    app.innerHTML = h;
    document.getElementById("pdf")?.addEventListener("click", () => { pdf = true; report(true); });
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && !seen.has(e.target.dataset.sec)){ seen.add(e.target.dataset.sec); dirty = true; } }), {threshold:.4});
    document.querySelectorAll("section[data-sec]").forEach(s => io.observe(s));
  }

  fetch(api, {credentials:"same-origin"}).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(async j => {
    staff = !!j.staff; render(j.data || {}, j.pdf); if (!staff) startVisit();
  }).catch(() => { app.innerHTML = `<div class="empty"><h2>Nabídka nenalezena</h2><p>Odkaz je neplatný. Napište nám prosím na <a href="mailto:info@primashade.cz">info@primashade.cz</a>.</p></div>`; });
})();
</script>
</body>
</html>
