<style>
/* Layout: dark petrol side menu on the left, record tabs strip on top, list grids with a summary footer, record detail with phase bar and a right info column. */
:root{
  --side:#16384a; --side-2:#1f4a60; --side-ink:#e6f0f4; --side-muted:#9fb9c6;

  --g-sales:#3f7fc4; --g-order:#8b5cb8; --g-install:#3a9a5b; --g-collect:#d08a17; --g-claim:#d2463c; --g-end:#8a959c;
  --f:"Roboto", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"Roboto Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --side:#0f2633; --side-2:#173646; --side-ink:#e6f0f4; --side-muted:#8fa9b6;
  --bg:#141a1e; --surface:#1c242a; --surface-2:#222c33; --line:#33414b; --fg:#e3e9ed; --muted:#9aa8b2;
  --accent:#f0a23b; --accent-ink:#2b1a04; --link:#5cb8e4; --link-soft:#173646;
  --good:#5cc27e; --bad:#f07a70; --warn:#e8b04a; --good-soft:#1d3527; --bad-soft:#3d2220; --warn-soft:#3a2f17;
  --g-sales:#6fa7e6; --g-order:#b693dd; --g-install:#5cc27e; --g-collect:#e8b04a; --g-claim:#f07a70; --g-end:#9aa8b2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#0f2633; --side-2:#173646; --side-ink:#e6f0f4; --side-muted:#8fa9b6;
  --bg:#141a1e; --surface:#1c242a; --surface-2:#222c33; --line:#33414b; --fg:#e3e9ed; --muted:#9aa8b2;
  --accent:#f0a23b; --accent-ink:#2b1a04; --link:#5cb8e4; --link-soft:#173646;
  --good:#5cc27e; --bad:#f07a70; --warn:#e8b04a; --good-soft:#1d3527; --bad-soft:#3d2220; --warn-soft:#3a2f17;
  --g-sales:#6fa7e6; --g-order:#b693dd; --g-install:#5cc27e; --g-collect:#e8b04a; --g-claim:#f07a70; --g-end:#9aa8b2;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--side)}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;height:100dvh}
/* side menu */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:14px 0 10px;padding-left:env(safe-area-inset-left,0px);overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 16px 14px;font-weight:700;font-size:18px;letter-spacing:.01em}
.logo span.b{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.gsearch{margin:0 12px 12px;position:relative}
.gsearch input{background:var(--side-2);border:0;color:var(--side-ink);border-radius:18px;padding:8px 12px 8px 32px}
.gsearch input::placeholder{color:var(--side-muted)}
.gsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%)}
.side nav{display:flex;flex-direction:column}
.side .it{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:9px 18px;color:var(--side-ink);font-weight:500;font-size:14px;position:relative}
.side .it svg{flex:none;opacity:.85}
.side .it:hover{background:var(--side-2)}
.side .it[aria-current="page"]{background:var(--side-2)}
.side .it[aria-current="page"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.side .it:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.side .sub{display:flex;flex-direction:column;padding-bottom:4px}
.side .sub .it{padding:6px 18px 6px 48px;font-size:13px;color:var(--side-muted)}
.side .sub .it[aria-current="page"]{color:var(--side-ink)}
.side .bottom{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px solid var(--side-2)}
.newmenu{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(56px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--fg);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px 0;z-index:50;min-width:200px}
.newmenu button{all:unset;cursor:pointer;display:block;padding:7px 16px;font-size:14px;width:100%;box-sizing:border-box}
.newmenu button:hover{background:var(--surface-2)}
.newmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* top strip */
.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{display:flex;align-items:stretch;gap:0;background:var(--surface);border-bottom:1px solid var(--line);min-height:44px;padding-right:max(12px,env(safe-area-inset-right,0px))}
.rtabs{display:flex;overflow-x:auto;flex:1;min-width:0}

.rtab[aria-current="page"]{color:var(--fg);background:var(--bg);box-shadow:inset 0 -2px 0 var(--accent)}

.user{display:flex;align-items:center;gap:8px;padding-left:12px;font-size:13px;white-space:nowrap}

.user select{width:auto;border:0;background:none;font-weight:500;padding:4px}
main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding-block:14px 14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));min-width:0}
main>*{flex-shrink:0}
main>.grid{flex:1 1 0;min-height:160px;overflow:auto}

table.g thead th{position:sticky;top:0;background:var(--surface);z-index:1}
/* common */
h1{font-size:24px;font-weight:500;margin:0} h2{font-size:15px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:500 13px var(--f);padding:7px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.blue{background:var(--link);border-color:var(--link);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff} .btn.bad{color:var(--bad)} .btn.badfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.up{text-transform:uppercase;font-weight:700;font-size:12px;letter-spacing:.03em}
.plus{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
input,select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 2px var(--link-soft)}
label.f{display:flex;flex-direction:column;gap:3px;min-width:0} label.f>span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
label.c{display:flex;gap:8px;align-items:center} label.c input{width:auto}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.card .ch{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
.card .cb{padding:12px 14px}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.empty{text-align:center;padding:40px 16px;color:var(--muted)} .empty strong{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
/* list view */
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lhead h1{margin-right:8px}
.lsearch{width:200px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 12px;font:500 12.5px var(--f);cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--link-soft);border-color:var(--link);color:var(--link)}
.lhead .sp{flex:1}
.grid{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table.g{width:100%;border-collapse:collapse;min-width:760px;font-size:13.5px}
table.g th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.g th.num{text-align:right;font-family:var(--f)} table.g td.num{text-align:right}
table.g th.s::after{content:" ▾";} table.g th.s.asc::after{content:" ▴";}
table.g td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.g tbody tr{cursor:pointer} table.g tbody tr:hover td{background:var(--surface-2)}
table.g td.star,table.g th.star{width:30px;padding-right:0;cursor:pointer} .star .on{color:var(--accent)} .star .off{color:var(--line)}
.sumbar{position:sticky;bottom:0;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;gap:24px;align-items:center;padding:8px 14px;font-size:13px;flex-wrap:wrap}
.sumbar b{font-family:var(--mono);font-weight:500}
.sumbar .sp{flex:1}
/* detail */
.dhead{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px;margin-bottom:14px}
.dtop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dtitle{font-size:22px;font-weight:500;margin:4px 0 0;max-width:720px;overflow-wrap:anywhere}
.price{text-align:right} .price .v{font-family:var(--mono);font-size:24px;font-weight:500}
.prob{width:46px;height:46px;flex:none}
.sumbox{border:1px solid var(--line);border-radius:6px;padding:8px 14px;background:var(--surface-2);display:grid;gap:2px;align-self:stretch;align-content:center}
.sumbox.tot{background:var(--link-soft);border-color:var(--link)} .sumbox.tot .lbl{color:var(--link)}
.sumrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:10px}
.sumrow .sumbox{text-align:right;flex:1 1 auto;padding:8px 12px} .sumrow .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500;white-space:nowrap} .sumrow .tot .v{font-size:18px;font-weight:700}
.sumbox.disc .v{color:var(--bad)}
.onl{display:flex;flex-wrap:wrap;gap:8px}

.onl-u .av{position:relative;width:40px;height:40px;font-size:14px} .onl-u .av i{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}

.phasebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 12px}
.phasebtn{position:relative}
.phasebtn select{appearance:none;-webkit-appearance:none;border-radius:4px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px 32px 8px 12px;color:#fff;border:0;cursor:pointer;width:auto;min-width:220px}
.phasebtn::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;pointer-events:none}
.track{display:flex;gap:2px;flex:1;min-width:160px}

.meta{display:flex;gap:28px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}

.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.calgrid{grid-template-columns:minmax(0,1fr) 230px}

.dtabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 6px}

.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 16px} .kv dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px} .kv dd{margin:0;overflow-wrap:anywhere}
.rcol{display:grid;gap:12px}

.tl{display:grid;gap:0}

.drop{border:2px dashed var(--line);border-radius:6px;padding:16px;text-align:center;color:var(--muted);margin-bottom:12px}
.drop.over{border-color:var(--link);background:var(--link-soft)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px))}
.modal{position:fixed;inset:0;background:rgba(10,20,26,.5);z-index:55;display:grid;place-items:center;padding:16px}

.dcard textarea{height:100%;min-height:70px}

const blobToB64 = b => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = () => ko(r.error); r.readAsDataURL(b); });
function fileRefs(docs){
  const ids = new Set();
  const walk = (v, top) => { if (Array.isArray(v)) v.forEach(x => walk(x)); else if (v && typeof v === "object"){ for (const [k,x] of Object.entries(v)){ if ((k==="fileId"||k==="pdfId") && typeof x==="string") ids.add(x); else walk(x); } if (!top && typeof v.id==="string" && ("size" in v || "type" in v || "contentType" in v || "at" in v)) ids.add(v.id); } };
  docs.forEach(d => d.col!=="config" && walk(d.data, true)); return [...ids];
}
async function exportAll(){
  const lg = t => { const el = $("#exp-log"); if (el) el.textContent = t; };
  const docs = [];
  for (const col of COLS){ if (col==="accounts" || col==="presence") continue; for (const r of (col==="config" ? [{id:"main", ...C()}] : S[col]||[])){ const {id, ...data} = JSON.parse(JSON.stringify(r)); docs.push({col, id, data}); } }
  const blobs = [], ids = fileRefs(docs); let miss = 0;
  for (let i = 0; i < ids.length; i++){ lg(`Soubory ${i+1}/${ids.length}…`); try { const r = await fetch(blobUrl(ids[i])); if (!r.ok) { miss++; continue; } const b = await r.blob(); blobs.push({key:ids[i], type:b.type, b64:await blobToB64(b)}); } catch { miss++; } }
  const out = new Blob([JSON.stringify({format:"stinko-export", version:1, at:Date.now(), docs, blobs})], {type:"application/json"});
  const name = `stinko-export-${today()}.json`;
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(()=>null) : null;
  if (dl) await dl.save({filename:name, data:out}); else { const a = document.createElement("a"); a.href = URL.createObjectURL(out); a.download = name; a.click(); }
  lg(`Hotovo: ${docs.length} záznamů, ${blobs.length} souborů${miss?`, ${miss} odkazů bez souboru`:""}.`);
}
async function importAll(file){

  let j; try { j = JSON.parse(await file.text()); } catch { toast("Soubor není platný export."); return; }
  if (j.format !== "stinko-export"){ toast("Soubor není export ze Stínko CRM."); return; }
  lg("Nahrávám záznamy…"); const r = await SV.api("/api/stinko/import", {body:{docs:j.docs}});
  let n = 0, bad = 0;
  for (const b of j.blobs||[]){
    lg(`Záznamů ${r.imported}. Soubory ${++n}/${j.blobs.length}…`);
    try { const bin = Uint8Array.from(atob(b.b64), c => c.charCodeAt(0)); const fd = new FormData(); fd.append("key", b.key); if (b.name) fd.append("name", b.name); if (b.type) fd.append("type", b.type); fd.append("file", new Blob([bin], {type:b.type||"application/octet-stream"}), b.name || b.key.split("/").pop()); await SV.api("/api/stinko/upload", {body:fd}); } catch(e){ console.error(e); bad++; }
  }
  lg(`Hotovo: ${r.imported} záznamů, ${n-bad} souborů${bad?`, ${bad} se nepovedlo`:""}.`); toast("Import dokončen");
}

async function saveStates(){

async function stockOutDeal(deal, why){

}

function commsFor({leadId, clientId, dealId}){
  const leadIds = new Set(), dealIds = new Set(), clientIds = new Set();
  if (leadId) leadIds.add(leadId); if (dealId) dealIds.add(dealId); if (clientId) clientIds.add(clientId);
  for (let k=0;k<2;k++){
    S.leads.forEach(l => { if (leadIds.has(l.id) && l.dealId) dealIds.add(l.dealId); if (l.dealId && dealIds.has(l.dealId)) leadIds.add(l.id); });
    S.deals.forEach(d => { if (dealIds.has(d.id) && d.clientId) clientIds.add(d.clientId); if (clientIds.has(d.clientId) && clientId) dealIds.add(d.id); });
    if (clientId) S.clients.filter(c=>clientIds.has(c.id) && c.leadCode).forEach(c => S.leads.filter(l=>l.code===c.leadCode).forEach(l=>leadIds.add(l.id)));
  }
  const fromComms = S.comms.filter(c => leadIds.has(c.leadId) || dealIds.has(c.dealId) || (clientId && clientIds.has(c.clientId)));
  const fromActs = S.activities.filter(a => ["email","letter"].includes(a.type) && (dealIds.has(a.dealId) || (clientId && clientIds.has(a.clientId)))).map(a => ({id:"a-"+a.id, actId:a.id, at:new Date((a.date||today())+"T"+(a.time||"08:00")).getTime(), kind:a.type==="email"?"email":"letter", subject:a.title, body:a.note||"", status:a.status==="done"?"odesláno":a.status==="cancelled"?"zrušeno":"naplánováno", by:a.owner}));
  return [...fromComms, ...fromActs].sort((a,b)=>b.at-a.at);
}

function barChart(months, vals){
  const W = 560, H = 200, L = 64, B = 24, T = 10;
  const max = Math.max(...vals, 0); const step = nice(max/4 || 100000); const top = step*4; const bw = (W-L-8)/months.length; const y = v => T + (H-T-B)*(1-v/top);
  const MON = ["led","úno","bře","dub","kvě","čvn","čvc","srp","zář","říj","lis","pro"];
  let g = ""; for (let k=0;k<=4;k++){ const v = step*k; g += `<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${Math.round(v/100).toLocaleString("cs-CZ")}</text>`; }
  const bars = vals.map((v,i) => { const x = L + i*bw + bw*.2, w = bw*.6; return `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0,H-B-y(v))}" rx="2" fill="var(--link)"><title>${months[i]}: ${money(v)}</title></rect><text x="${x+w/2}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${MON[Number(months[i].slice(5))-1]}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Vývoj prodeje po měsících">${g}${bars}</svg>`;
}
function nice(x){ const p = Math.pow(10, Math.floor(Math.log10(x))); const n = x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

async function shrink(file){
  if (!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)) return file;
  try { const bmp = await createImageBitmap(file); const s = Math.min(1, 2000/Math.max(bmp.width,bmp.height)); if (s === 1 && file.size < 1.5e6) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", .85)); return b ? new File([b], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"}) : file; } catch { return file; }
}
async function uploadFiles(kind, rid, fileList){
  if (!assets){ toast("Nahrávání tady není dostupné."); return; }
  const col = colFor(kind); const files = [...fileList]; if (!files.length) return;
  toast(`Nahrávám ${files.length} ${files.length===1?"soubor":"soubory"}…`);
  const added = [];
  for (const f of files){ try { const small = await shrink(f); const r = await assets.upload(small); added.push({id:r.id, name:f.name, type:r.contentType||small.type, size:r.sizeBytes, at:Date.now(), by:me()}); } catch(e){ console.error(e); toast(e?.code==="too_large"?`${f.name} je moc velký.`:e?.code==="unsupported_type"?`${f.name}: nepodporovaný typ.`:`${f.name} se nenahrál.`); } }
  if (!added.length) return;
  const src = S[col].find(x=>x.id===rid); const rec = JSON.parse(JSON.stringify(src));
  rec.photos = [...(rec.photos||[]), ...added]; if (kind==="deal") log(rec, `Přidáno ${added.length} ${added.length===1?"soubor":"souborů"}`, "file");
  if (await save(col, rec)) toast("Nahráno");
}

function initSigPad(){

  let down = false, last = null; c._dirty = false;
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width, (e.clientY-r.top)*c.height/r.height]; };
  c.addEventListener("pointerdown", e => { down = true; last = pos(e); c.setPointerCapture(e.pointerId); });
  c.addEventListener("pointermove", e => { if (!down) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; c._dirty = true; });
  const up = () => { down = false; }; c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
}

const CAL_H = 48;
const tmin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t||""); return m ? Number(m[1])*60 + Number(m[2]) : null; };
const calInst = (s, users) => canSee("installs") ? S.installs.filter(x=>x.date===s && users.some(u=>(x.techs||[]).includes(u)||!(x.techs||[]).length)) : [];

function calTimeGrid(dates, acts, users){
  const DN = ["Ne","Po","Út","St","Čt","Pá","So"], t = today();
  const cols = dates.map(s => {
    const ev = acts.filter(a=>a.date===s).map(a => ({a, st:tmin(a.time), dur:Math.max(15, toN(a.duration)||60)}));
    calInst(s, users).forEach(x => { const F = x.f||{}; const st = tmin(F.start) ?? tmin(x.time), en = tmin(F.end); ev.push({inst:x, st, dur: st!=null && en!=null && en>st ? en-st : 240}); });
    const timed = ev.filter(e=>e.st!=null).sort((a,b)=>a.st-b.st || b.dur-a.dur);
    // overlapping events share the column width side by side
    let lanes = [], cluster = [], cEnd = -1; const flush = () => { const n = Math.max(...cluster.map(e=>e.lane))+1; cluster.forEach(e=>e.n=n); cluster = []; lanes = []; cEnd = -1; };
    for (const e of timed){ if (cluster.length && e.st >= cEnd) flush(); let l = lanes.findIndex(x=>x<=e.st); if (l<0){ l = lanes.length; lanes.push(0); } lanes[l] = e.st+e.dur; e.lane = l; cluster.push(e); cEnd = Math.max(cEnd, e.st+e.dur); }
    if (cluster.length) flush();
    return {s, allday:ev.filter(e=>e.st==null), timed};
  });
  let h0 = 7, h1 = 20; cols.forEach(c => c.timed.forEach(e => { h0 = Math.min(h0, Math.floor(e.st/60)); h1 = Math.max(h1, Math.min(24, Math.ceil((e.st+e.dur)/60))); }));
  const hr = m => (m - h0*60) / 60;
  const evBox = e => { const inst = e.inst, top = hr(e.st), h = Math.min(hr(e.st+e.dur), h1-h0) - top;
    const end = e.st+e.dur, tt = `${pad(Math.floor(e.st/60))}:${pad(e.st%60)}–${pad(Math.floor(end/60)%24)}:${pad(end%60)}`;
    const [act, id, bg, done, title] = inst ? ["open-install", inst.id, "var(--g-install)", inst.status==="done", "🔧 "+(getDeal(inst.dealId)?.name||"Montáž")] : ["open-act", e.a.id, ACT_COLOR[e.a.type], e.a.status==="done", (ACT[e.a.type]?.[1]||"")+" "+e.a.title];
    const sub = inst ? clientName(getDeal(inst.dealId)?.clientId) : (e.a.dealId ? getDeal(e.a.dealId)?.name : clientName(e.a.clientId)) || "";
    return `<span class="tg-ev ${done?"done":""}" style="top:calc(var(--hh) * ${top});height:calc(var(--hh) * ${h} - 2px);left:calc(${e.lane/e.n*100}% + 2px);width:calc(${100/e.n}% - 4px);background:${bg}" data-act="${act}" data-id="${id}" title="${esc(tt+" "+title)}"><b>${esc(title)}</b><small>${tt}${sub?" · "+esc(sub):""}</small></span>`; };
  const now = new Date(), nowM = now.getHours()*60 + now.getMinutes();
  return `<div class="tgw"><div class="tg" data-hours="${h1-h0}" style="--n:${dates.length};min-width:${dates.length>1?720:0}px">
    <div class="tg-c tg-corner"></div>${cols.map(c => { const d = new Date(c.s+"T12:00:00"); return `<div class="tg-c tg-dh ${c.s===t?"today":""}" data-act="cal-goday" data-date="${c.s}" title="Zobrazit den">${DN[d.getDay()]}<b>${d.getDate()}</b></div>`; }).join("")}
    <div class="tg-c tg-lbl">celý den</div>${cols.map(c => `<div class="tg-c tg-ad">${c.allday.map(calChip).join("")}</div>`).join("")}
    <div class="tg-times">${Array.from({length:h1-h0}, (_,i) => `<div>${pad(h0+i)}:00</div>`).join("")}</div>
    ${cols.map(c => `<div class="tg-col ${c.s===t?"today":""}" data-act="cal-slot" data-date="${c.s}" data-h0="${h0}" style="height:calc(var(--hh) * ${h1-h0})" title="Klikněte pro novou aktivitu">${c.timed.map(evBox).join("")}${c.s===t && nowM>=h0*60 && nowM<h1*60 ? `<span class="tg-now" style="top:calc(var(--hh) * ${hr(nowM)})"></span>` : ""}</div>`).join("")}
  </div></div>`;
}

function readCfg(){
  const c = cfgDraft, lines = id => ($("#"+id)?.value||"").split("\n").map(s=>s.trim()).filter(Boolean);
  c.phases = [...document.querySelectorAll(".cfg-phase")].map((r,i)=>({id:c.phases[i]?.id||"p-"+uid().slice(0,8), name:r.querySelector(".ph-name").value.trim()||"Fáze", group:r.querySelector(".ph-group").value, kind:r.querySelector(".ph-kind").value}));
  c.users = lines("cfg-users"); c.types = lines("cfg-types"); c.categories = lines("cfg-cats"); c.leadStates = lines("cfg-leadst"); c.sources = lines("cfg-sources"); c.activityCategories = lines("cfg-actcats"); c.signDocs = lines("cfg-signdocs");
  const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||uid().slice(0,8);
  c.fieldGroups = [...document.querySelectorAll(".fg-name")].map((inp,i)=>{ const old = c.fieldGroups[i]?.fields||[]; const fields = (document.querySelector(`.fg-fields[data-ix="${i}"]`).value||"").split("\n").map(s=>s.trim()).filter(Boolean).map(line=>{ const [label,type="text",opts=""] = line.split("|").map(s=>s.trim()); const prev = old.find(f=>f.label===label); return {id:prev?.id||slug(label), label, type:["text","number","date","bool","select","textarea","secret"].includes(type)?type:"text", options:opts?opts.split("/").map(s=>s.trim()).filter(Boolean):[]}; }); return {name:inp.value.trim()||"Pole", fields}; });
  if (!c.users.length) c.users = ["Já"]; return c;
}

// Stored files: a PDF opens in an in-app preview (rendered with pdf.js) with a download button, other files download.
// On claude.ai a /_blob link opened in a new tab sits outside the app and answers "not found".
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function saveFile(name, blob){
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(()=>null) : null;
  if (dl) return dl.save({filename:name, data:blob});
  const u = URL.createObjectURL(blob), x = document.createElement("a"); x.href = u; x.download = name; x.click(); setTimeout(()=>URL.revokeObjectURL(u), 60000);
}
async function pdfPreview(href, name){
  document.getElementById("pdfview")?.remove();
  const ov = document.createElement("div"); ov.id = "pdfview"; ov.className = "modal"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-label", name);
  ov.innerHTML = `<div class="box" style="width:min(980px,100%);height:calc(100vh - 32px);display:flex;flex-direction:column"><div class="mh"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</b><span class="row" style="flex-wrap:nowrap"><button class="btn blue sm" data-pv="dl" disabled>Stáhnout</button><button class="btn sm" data-pv="close">Zavřít</button></span></div><div class="pv-pages" style="flex:1;overflow:auto;background:var(--surface-2);padding:12px;display:grid;gap:12px;justify-items:center"><div class="muted">Načítám PDF…</div></div></div>`;
  document.body.appendChild(ov);
  let blob = null, alive = true;
  const close = () => { alive = false; ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  ov.addEventListener("click", ev => { if (ev.target === ov || ev.target.closest('[data-pv="close"]')) close(); else if (ev.target.closest('[data-pv="dl"]') && blob) saveFile(name, blob).then(()=>toast("PDF se stahuje")); });
  const box = ov.querySelector(".pv-pages");
  try {
    const r = await fetch(href); if (!r.ok) throw new Error("HTTP " + r.status); blob = await r.blob(); ov.querySelector('[data-pv="dl"]').disabled = false;
    await loadScript(PDFJS + "pdf.min.js"); const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
    const doc = await lib.getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise;
    box.innerHTML = "";
    const w = Math.min(box.clientWidth - 24, 940), dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (let n = 1; n <= doc.numPages && alive; n++){
      const page = await doc.getPage(n), vp0 = page.getViewport({scale:1}), vp = page.getViewport({scale: w / vp0.width * dpr});
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height; c.style.width = "100%"; c.style.maxWidth = w + "px"; c.style.background = "#fff"; c.style.boxShadow = "0 1px 4px rgba(0,0,0,.2)";
      box.appendChild(c); await page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
    }
  } catch(err){ console.error(err); if (alive) box.innerHTML = `<div class="empty"><strong>Náhled se nepodařilo zobrazit</strong>${blob ? "PDF si můžete stáhnout tlačítkem nahoře." : "Soubor se nenačetl."}</div>`; }
}
document.addEventListener("click", async e => {
  const a = e.target.closest && e.target.closest('a[href^="/_blob/"]'); if (!a) return;
  e.preventDefault(); e.stopPropagation();
  const name = (a.dataset.name || a.textContent || "").replace(/^[\s📄]+/u, "").trim() || "soubor";
  if (/\.pdf$/i.test(name)) return pdfPreview(a.getAttribute("href"), name);
  try { const r = await fetch(a.getAttribute("href")); if (!r.ok) throw new Error(r.status); await saveFile(name, await r.blob()); toast("Soubor se stahuje"); }
  catch(err){ console.error(err); toast("Soubor se nepodařilo otevřít."); }
}, true);

async function movePhase(deal, phaseId, depth=0, why=""){
  if (!deal || deal.phaseId===phaseId) return null;
  const d = JSON.parse(JSON.stringify(deal)); const from = phaseById(d.phaseId).name, to = phaseById(phaseId);
  d.phaseId = phaseId; d.phaseSince = Date.now(); d.phaseHistory = [...(d.phaseHistory||[]), {phaseId, at:Date.now()}].slice(-60);
  if (to.kind!=="open"){ d.closedAt = today(); d.probability = to.kind==="won"?100:0; } else d.closedAt = null;
  log(d, `Stav: ${from} → ${to.name}${why?` (${why})`:""}`, "phase");
  if (!await save("deals", d)) return null;
  if (!why) toast(`Stav: ${to.name}`);
  const x = {deal:d}; await runAuto("deal_phase", x, depth); return x.deal;
}

      const np = v("d-phase");
      if (isNew){ Object.assign(d, {code:nextCode(S.deals, C().dealPrefix||"OP"), phaseId:np, phaseSince:Date.now(), custom:{}, products:[], photos:[], events:[], createdAt:Date.now()}); log(d, "Obchodní případ založen"); }

    }

      const l = {...r, name:v("l-name"), phone:v("l-phone"), email:v("l-email"), subject:v("l-subject"), state:v("l-state"), owner:v("l-owner"), source:v("l-source"), street:v("l-street"), city:v("l-city"), zip:v("l-zip"), receivedAt:v("l-received")||today(), note:$("#l-note").value};

      if (isNew){ l.code = nextCode(S.leads, C().leadPrefix||"L"); l.createdAt = Date.now(); log(l, "Lead přijat"); } else log(l, "Údaje upraveny");

// ---------- boot ----------
async function boot(){
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  let user; [db, assets, user] = await Promise.all([use("db"), use("assets"), use("user")]);
  prefs = Object.assign({cols:{}, filters:{}, active:{}}, ls.get("stinko-prefs", {})); prefs.cols = {...(prefs.cols||{})}; prefs.filters = {...(prefs.filters||{})}; prefs.active = {...(prefs.active||{})};
  try { const uidv = user ? await user.id() : null; if (db && uidv){ prefsRef = db.collection("data/users/" + uidv).doc("prefs"); const snap = await prefsRef.get(); if (snap.exists) prefs = Object.assign({cols:{}, filters:{}, active:{}}, JSON.parse(JSON.stringify(snap.data()))); } } catch(e){ console.warn(e); }
  if (!db) S.offline = true;
  for (const col of COLS) store.sub(col, docs => {
    if (col==="installs" && S.view==="install" && S.loaded.installs && stableStr(docs.find(d=>d.id===S.param)) === stableStr(S.installs.find(d=>d.id===S.param))){ S.installs = docs; return; }
    if (col==="config"){ const m = docs.find(d=>d.id==="main"); S.config = {...DEFAULT_CONFIG, ...(m||{})}; } else S[col] = docs;
    const firstLoad = !S.loaded[col]; S.loaded[col] = true;
    if (col==="leads" || col==="accounts") setTimeout(processWebLeads, 500);
    const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest("#instform,#loginform,#setupform,#customform,#prodform,#commentform,#pdfform,.inl-note,.inl-state");
    if (col==="presence" && !firstLoad) paintOnline(); else if (!EDITING.includes(S.view) && !typing) render();
    if (col==="accounts" || col==="config") heartbeat();
    if (Object.values(S.loaded).every(Boolean) && !staleTimer){ staleTimer = setInterval(checkStale, 15*60*1000); setTimeout(checkStale, 4000); }
  });
}
boot();
setInterval(heartbeat, 60*1000); setInterval(paintOnline, 30*1000);
document.addEventListener("visibilitychange", heartbeat);
})();
